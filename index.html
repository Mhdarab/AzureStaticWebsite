
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azure Guided Project</title>
</head>
<body>
  <h1>Azure Static Website</h1>
  <p>Welcome to my Azure Guided Project!</p>

  <input type="text" id="name" placeholder="Enter your name">
  <button onclick="sayHello()">Say Hello</button>

  <p id="result"></p>

  
<script>
  async function sayHello() {
    const name = document.getElementById("name").value.trim();
    const result = document.getElementById("result");

    if (!name) {
      result.textContent = "Please enter your name.";
      return;
    }

    result.textContent = "Connecting to Azure...";

    const apiUrl =
      "https://azure-node-demo2026-fxfzbrb5abhqhtb3.swedencentral-01.azurewebsites.net/api/helloazure";

    try {
      const response = await fetch(
        `${apiUrl}?name=${encodeURIComponent(name)}`
      );

      if (!response.ok) {
        throw new Error(`HTTP Error: ${response.status}`);
      }

      const data = await response.json();

      result.textContent = data.message;

    } catch (error) {
      result.textContent = "Error connecting to Azure Function.";
      console.error(error);
    }
  }
</script>

</body>
</html>
